version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: xpoll_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - xpoll_network

  backend:
    build: ./backend
    container_name: xpoll_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/xpoll
      - JWT_SECRET=dev_secret_key_123
      - GOOGLE_CLIENT_ID=mock_client_id
      - GOOGLE_CLIENT_SECRET=mock_client_secret
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
    networks:
      - xpoll_network

  frontend:
    build: ./frontend
    container_name: xpoll_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - xpoll_network

networks:
  xpoll_network:
    driver: bridge

volumes:
  mongo_data:
